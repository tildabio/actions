name: 'Cherry Pick PR to Target Branch'
description: 'Cherry picks a merged PR to a target branch based on PR body decision'
author: 'Tilda Bio'

inputs:
  source-branch:
    description: 'Branch where PR was merged (e.g., master, main, production)'
    required: true
  target-branch:
    description: 'Branch to cherry-pick into (e.g., production, master, staging)'
    required: true
  github-token:
    description: >
      GitHub token for API operations. Prefer a GitHub App installation token
      (e.g. via actions/create-github-app-token) so the cherry-pick PR and its
      commits are attributed to a bot identity rather than a person's PAT.
    required: true
  committer:
    description: >
      Committer identity for the cherry-pick commit, as `Display Name <email>`.
      Defaults to the GitHub Actions bot so automation is not attributed to a person.
    required: false
    default: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
  author:
    description: >
      Author identity for the cherry-pick commit, as `Display Name <email>`.
      Defaults to the original PR author so contribution analytics credit the
      developer who wrote the change rather than whoever merged it.
    required: false
    default: '${{ github.event.pull_request.user.login }} <${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com>'
  pr-body:
    description: 'The PR body text to check for merge decision'
    required: true
  cherry-pick-branch-prefix:
    description: 'Prefix for cherry-pick branch name'
    required: false
    default: 'cherry-pick-'
  cherry-pick-pr-body:
    description: 'Body text for the created cherry-pick PR'
    required: false
    default: '[x] cleanup branches'
  labels:
    description: 'Labels to add to cherry-pick PR (newline or comma separated)'
    required: false
    default: |
      cherry-pick
      automerge
  decision-branch:
    description: >-
      The branch the merge decision line has to name, when target-branch is a stand-in for it (a sandbox branch
      standing in for production, say). Defaults to target-branch.
    required: false
    default: ''
  decision-pattern:
    description: 'Legacy: a custom regex to match instead of the shared parser (merge-decision/decision.py). Leave empty.'
    required: false
    default: ''

outputs:
  should-cherry-pick:
    description: 'Whether the cherry-pick should proceed (true/false)'
    value: ${{ steps.check-decision.outputs.should_merge }}
  cherry-pick-status:
    description: 'Status of the cherry-pick operation (success/skipped/failed)'
    value: ${{ steps.set-status.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Check merge decision
      id: check-decision
      shell: bash
      env:
        PR_BODY: ${{ inputs.pr-body }}
        TARGET_BRANCH: ${{ inputs.decision-branch || inputs.target-branch }}
        CUSTOM_PATTERN: ${{ inputs.decision-pattern }}
      run: |
        if [ -n "$CUSTOM_PATTERN" ]; then
          # Legacy: a caller-supplied regex, matched as before (lower-cased, whitespace collapsed). New callers should
          # leave decision-pattern empty: the shared parser below is what validate-merge-decision checks against.
          NORMALIZED_BODY=$(printf '%s\n' "$PR_BODY" | tr -s '[:space:]' ' ' | tr '[:upper:]' '[:lower:]')
          if printf '%s\n' "$NORMALIZED_BODY" | grep -qE "$CUSTOM_PATTERN"; then
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
            echo "✅ Custom pattern matched: will cherry-pick to $TARGET_BRANCH"
          else
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Custom pattern not matched: will NOT cherry-pick to $TARGET_BRANCH"
          fi
          exit 0
        fi
        # The same parser the validate-merge-decision check uses (merge-decision/decision.py): the check and the
        # cherry-pick read a description identically. Only an unambiguous Yes for this branch cherry-picks; No, a
        # missing or unfilled line, or a Yes and a No together, do not.
        python3 "$GITHUB_ACTION_PATH/../merge-decision/decision.py" should-merge --target "$TARGET_BRANCH"

    - name: Checkout repository
      if: steps.check-decision.outputs.should_merge == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github-token }}

    - name: Cherry pick to target branch
      if: steps.check-decision.outputs.should_merge == 'true'
      id: cherry-pick
      uses: carloscastrojumo/github-cherry-pick-action@v1.0.9
      with:
        token: ${{ inputs.github-token }}
        committer: ${{ inputs.committer }}
        author: ${{ inputs.author }}
        branch: ${{ inputs.target-branch }}
        cherry-pick-branch: ${{ inputs.cherry-pick-branch-prefix }}${{ github.event.pull_request.head.ref }}
        body: ${{ inputs.cherry-pick-pr-body }}
        labels: ${{ inputs.labels }}

    - name: Set output status
      id: set-status
      shell: bash
      if: always()
      run: |
        if [ "${{ steps.check-decision.outputs.should_merge }}" != "true" ]; then
          echo "status=skipped" >> $GITHUB_OUTPUT
          echo "📊 Status: Skipped (no merge decision found)"
        elif [ "${{ steps.cherry-pick.outcome }}" == "success" ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "📊 Status: Success"
        else
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "📊 Status: Failed"
        fi

branding:
  icon: 'git-branch'
  color: 'blue'
