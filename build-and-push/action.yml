name: "Build and Push to Google Artifactory"
description: >
  Build a docker container with buildx + registry-backed layer cache and optionally
  publish it to Google Artifact Registry. Caller is responsible for checking
  out the repository before invoking this action.
inputs:
  google-key:
    description: "GCP service-account JSON key used to authenticate gcloud"
    required: true
  service-name:
    description: "Image name (used as registry path leaf and as cache scope)"
    required: true
  google-project:
    description: "GCP project to push to"
    required: false
    default: "tilda-dev-325721"
  context:
    description: "Path to the docker build context"
    required: false
    default: "."
  file:
    description: "Path to the Dockerfile"
    required: false
    default: "Dockerfile"
  push:
    description: "Whether to push the built image (string 'true' or 'false')"
    required: false
    default: "true"
  artifactory-url:
    description: "Artifact Registry host"
    required: false
    default: "us-central1-docker.pkg.dev"
  target:
    description: "Target stage to build"
    required: false
    default: ""
  build_args:
    description: "Additional build arguments, newline-separated"
    required: false
    default: ""
  cache:
    description: "Enable buildx GitHub Actions layer cache (string 'true'/'false')"
    required: false
    default: "true"
  cache-scope:
    description: "Override cache scope (defaults to service-name)"
    required: false
    default: ""
outputs:
  image:
    description: "Fully-qualified image reference that was built (registry/project/path:tag)"
    value: ${{ steps.meta.outputs.tags }}
  digest:
    description: "Image digest of the built image"
    value: ${{ steps.build.outputs.digest }}
  version:
    description: "Image version tag (the short SHA part)"
    value: ${{ steps.meta.outputs.version }}
runs:
  using: "composite"
  steps:
    # Backwards-compat: ensure the workspace is checked out even if the
    # caller didn't do its own checkout. `clean: false` is idempotent for
    # callers that already checked out (the action's matrix jobs in
    # build-all/dependabot-verify do their own checkout for resolve-base).
    - name: Ensure repo checked out
      uses: actions/checkout@v4
      with:
        clean: false

    - name: Authenticate to Google Cloud
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.google-key }}

    - name: Set up gcloud
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure docker for Artifact Registry
      if: github.event.pull_request.user.login != 'dependabot[bot]'
      shell: bash
      run: gcloud auth configure-docker ${{ inputs.artifactory-url }} --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Compute image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.artifactory-url }}/${{ inputs.google-project }}/artifacts/services/${{ inputs.service-name }}
        tags: |
          type=sha,enable=true,priority=100,prefix=${{ github.head_ref || github.ref_name }}-,suffix=,format=short

    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        target: ${{ inputs.target }}
        build-args: |
          BUILDARG_VERSION=${{ steps.meta.outputs.version }}
          ${{ inputs.build_args }}
        # Registry-backed layer cache (one :buildcache tag per service repo).
        # Replaces type=gha, which was over GitHub's 10 GB Actions-cache limit
        # (~20 services x mode=max ~= 12+ GB) so caches were LRU-evicted before
        # reuse -> 0% hits. Registry cache has no such cap and is shared across
        # branches. image-manifest/oci-mediatypes are required for GAR.
        # Only WRITE on push builds (PR/dependabot builds lack push creds); all
        # builds READ the shared cache. ignore-error=true makes a cache-export
        # failure non-fatal — the build always succeeds, so the worst case is
        # "no caching" (today's behaviour), never a broken pipeline.
        cache-from: ${{ inputs.cache == 'true' && format('type=registry,ref={0}/{1}/artifacts/services/{2}:buildcache', inputs.artifactory-url, inputs.google-project, inputs.service-name) || '' }}
        cache-to: ${{ inputs.cache == 'true' && inputs.push == 'true' && format('type=registry,ref={0}/{1}/artifacts/services/{2}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', inputs.artifactory-url, inputs.google-project, inputs.service-name) || '' }}

    - name: Summarize
      shell: bash
      run: |
        {
          echo "### ${{ inputs.service-name }}"
          echo ""
          echo "- **Image**: \`${{ steps.meta.outputs.tags }}\`"
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`"
          echo "- **Pushed**: \`${{ inputs.push }}\`"
          echo "- **Cache**: \`registry (${{ inputs.artifactory-url }}/${{ inputs.google-project }}/artifacts/services/${{ inputs.service-name }}:buildcache)\`"
        } >> "$GITHUB_STEP_SUMMARY"
