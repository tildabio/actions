name: 'Validate Merge Decision'
description: 'Checks that a PR description says whether the PR should also be merged into the other branch'
author: 'Tilda Bio'

# The description is read by merge-decision/decision.py, the same parser cherry-pick-pr uses after the merge, so what
# this check accepts is exactly what the cherry-pick acts on. It tolerates formatting (bold, bullets, spacing, case,
# punctuation) and is strict about the answer (Yes or No, once). See merge-decision/README.md.

inputs:
  base-branch:
    description: 'The branch this PR is targeting (master, main or production)'
    required: true
  pr-body:
    description: 'The PR body text to validate'
    required: true
  github-token:
    description: 'Token allowed to comment on the PR (pull-requests: write)'
    required: true
  pr-number:
    description: 'Pull request number'
    required: true
  pr-user:
    description: 'Pull request author username'
    required: true
  repository:
    description: 'Repository name in format owner/repo'
    required: true

outputs:
  validation-status:
    description: >-
      valid_yes, valid_no, conflicting, placeholder, unclear, no_branch, wrong_branch, missing or not_applicable
    value: ${{ steps.validation.outputs.validation_status }}
  decision:
    description: 'yes, no or none'
    value: ${{ steps.validation.outputs.decision }}
  target-branch:
    description: 'The branch the decision is about (production for PRs into master/main, master for PRs into production)'
    value: ${{ steps.validation.outputs.target_branch }}

runs:
  using: 'composite'
  steps:
    - name: Read the merge decision
      id: validation
      shell: bash
      env:
        PR_BODY: ${{ inputs.pr-body }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        PR_USER: ${{ inputs.pr-user }}
      run: |
        python3 "$GITHUB_ACTION_PATH/../merge-decision/decision.py" validate \
          --base "$BASE_BRANCH" --head "${GITHUB_HEAD_REF:-}" --user "$PR_USER"

    - name: Comment on the PR
      if: always() && steps.validation.outputs.validation_status != '' && steps.validation.outputs.validation_status != 'not_applicable'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPOSITORY: ${{ inputs.repository }}
        FAILED: ${{ steps.validation.outputs.failed }}
        MESSAGE: ${{ steps.validation.outputs.message }}
        DECISION: ${{ steps.validation.outputs.decision }}
        TARGET: ${{ steps.validation.outputs.target_branch }}
      run: |
        # One comment per PR, found again by this marker and edited in place: a failing description no longer gets a new
        # comment on every edit, and once it is fixed the same comment says so.
        MARKER='<!-- tildabio/actions validate-merge-decision -->'
        existing=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
                     --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | tail -n 1 || true)
        if [ "$FAILED" = "true" ]; then
          printf '%s\n\n%s\n' "$MARKER" "$MESSAGE" > /tmp/merge-decision-comment.md
        elif [ -n "$existing" ]; then
          printf '%s\n\n✅ Merge decision found: **%s** into `%s`.\n' "$MARKER" "$DECISION" "$TARGET" > /tmp/merge-decision-comment.md
        else
          exit 0   # fine, and nothing was said before: stay quiet
        fi
        jq -Rs '{body: .}' /tmp/merge-decision-comment.md > /tmp/merge-decision-comment.json
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPOSITORY/issues/comments/$existing" --input /tmp/merge-decision-comment.json > /dev/null \
            || echo "::warning::could not update the PR comment"
        else
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input /tmp/merge-decision-comment.json > /dev/null \
            || echo "::warning::could not comment on the PR"
        fi

    - name: Fail when the decision is missing or unclear
      if: steps.validation.outputs.failed == 'true'
      shell: bash
      env:
        MESSAGE: ${{ steps.validation.outputs.message }}
      run: |
        printf '%s\n' "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
        printf '%s\n' "$MESSAGE"
        exit 1

branding:
  icon: 'check-circle'
  color: 'green'
